<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recettes - Cuisine du monde !</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-container">
        <img src="./images/logo.png" alt="Les Recettes - Cuisine du Monde" width="auto" height="350">
    </div>
    
    <div class="actions">
        <a href="./catalogue.html" class="btnhome">Voir les recettes</a>
    </div>

    <div class="actions" id="auth-action-container">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const authContainer = document.getElementById("auth-action-container");
            const token = localStorage.getItem("token");

            if (token) {
                const logoutBtn = document.createElement("button");
                logoutBtn.className = "btnhome btn-logout";
                logoutBtn.textContent = "Se déconnecter";
                logoutBtn.addEventListener("click", () => {
                    localStorage.removeItem("token");
                    window.location.reload();
                });
                authContainer.appendChild(logoutBtn);
            } else {
                const loginLink = document.createElement("a");
                loginLink.href = "./auth_page.html";
                loginLink.className = "btnhome";
                loginLink.textContent = "Se connecter / S'inscrire";
                authContainer.appendChild(loginLink);
            }
        });
    </script>
</body>
</html>
