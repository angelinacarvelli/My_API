<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Recette - Cuisine du Monde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="catalogue_exemple.html" class="back-button"> &#10140; </a>
    <main class="content-container">
        <section class="left-section">
            <h1 class="title" id="recipe-title"> RECETTE </h1>
            <div class="image-frame">
                <img src="./images/recipe.png" alt="Recette" id="recipe-image" Class="recipe-image">
            </div>
            <div class="badge country-badge" id="recipe-country"> PAYS </div>
        </section>
        <section class="right-section">
            <div class="logo-container">
                <img src="./images/logo.png" alt="Les Recettes - Cuisine du Monde" class="logo">
            </div>
            <div class="ingredients-card">
                <h2>INGRÉDIENTS</h2>
                <ul id="recipe-ingredients"> </ul>
            </div>
        </section>
    </main>
    <script>
        const API_URL = "http://localhost:3000/api/plats";
        async function loadRecipe() {
            const urlParams =
                new URLSearchParams(
                    window.location.search
                );
            const slug =
                urlParams.get("slug");
            if (!slug) {
                console.error(
                    "Aucun slug fourni"
                );
                return;
            } try {
                const response =
                    await fetch(
                        `${API_URL}/slug/${encodeURIComponent(slug)}`
                    );

                if (!response.ok) {
                    throw new Error(
                        "Plat introuvable"
                    );
                }
                const plat =
                    await response.json();
                document.getElementById(
                    "recipe-title"
                ).textContent =
                    plat.nom || "RECETTE";
                document.getElementById(
                    "recipe-country"
                ).textContent =
                    plat.pays || "PAYS";
                if (plat.image) {
                    document.getElementById(
                        "recipe-image"
                    ).src = plat.image;
                }
                const ingredientsList =
                    document.getElementById(
                        "recipe-ingredients"
                    );
                ingredientsList.innerHTML = "";
                if (
                    Array.isArray(
                        plat.ingredients
                    )
                ) {
                    plat.ingredients.forEach(
                        (ingredient) => {
                            const element =
                                document.createElement(
                                    "element"
                                );
                            element.textContent =
                                ingredient;
                            ingredientsList.appendChild(
                                element
                            );
                        }
                    );
                }
            } catch (error) {
                console.error(
                    "Erreur :",
                    error
                );
            }
        }
        loadRecipe();
    </script>
</body>
</html>
