<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue des recettes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #catalog-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            justify-items: center;
            padding: 20px 5%;
        }

        .recipe-card-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .recipe-card-item .image-frame {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 6px solid #6d5852;
            overflow: hidden;
            background-color: #c4e4ff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .recipe-card-item .recipe-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .recipe-card-title {
            margin-top: 12px;
            font-size: 18px;
            color: #6d5852;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <a href="/Home_page.html" class="back-button">&#10140;</a>
    <div class="bottom-actions">
        <a href="/ajout_plat.html" class="btnhome btn-add">+ Ajouter un plat</a>
    </div>

    <div class="search-container" style="text-align: center; margin: 20px 0;">
        <input type="text" id="search-input" placeholder="Rechercher un plat, un ingrédient ou un pays..." style="padding: 10px; width: 60%; max-width: 400px; border-radius: 5px; border: 1px solid #ccc;">
        <button id="search-btn" onclick="triggerSearch()" class="btnhome" style="padding: 10px 15px;">Rechercher</button>
    </div>

    <div id="catalog-container">
    </div>

    <div class="pagination-container" style="text-align: center; margin: 30px 0; display: flex; justify-content: center; align-items: center; gap: 10px;">
        <button id="btn-prev" onclick="changePage(-1)" class="pagination-btn">Précédent</button>
        
        <span>Page</span>
        <input type="number" id="input-page" min="1" value="1" style="width: 50px; text-align: center; padding: 5px;" />
        <span id="page-info" class="page-info">/ 1</span>
        <button id="btn-go" onclick="goToPage()" class="btnhome" style="padding: 5px 10px;">Aller</button>

        <button id="btn-next" onclick="changePage(1)" class="pagination-btn">Suivant</button>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadCatalog(page = 1) {
            try {
                const searchInput = document.getElementById('search-input');
                const searchQuery = searchInput ? searchInput.value.trim() : "";

                let url = `/api/plats?page=${page}`;
                if (searchQuery) {
                    url += `&search=${encodeURIComponent(searchQuery)}`;
                }

                const response = await fetch(url);                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const result = await response.json();
                
                currentPage = result.page || result.currentPage || page;
                totalPages = result.totalPages || 1;

                const container = document.getElementById('catalog-container');
                container.innerHTML = '';

                const plats = result.data || result.plats || result;

                if (!plats || plats.length === 0) {
                    container.innerHTML = '<p style="text-align: center; width: 100%;">Aucun plat disponible.</p>';
                } else {
                    plats.forEach(plat => {
                        const slug = plat.slug || encodeURIComponent((plat.nom || plat.title).toLowerCase().replace(/\s+/g, '-'));
                        
                        const card = document.createElement('a');
                        card.href = `/recette/${slug}`;
                        card.className = 'recipe-card-item';

                        const frame = document.createElement('div');
                        frame.className = 'image-frame';

                        const img = document.createElement('img');
                        img.src = plat.image || './images/recipe.png';
                        img.alt = plat.nom || plat.title;
                        img.className = 'recipe-image';
                        frame.appendChild(img);

                        const title = document.createElement('div');
                        title.className = 'recipe-card-title';
                        title.textContent = plat.nom || plat.title;

                        card.appendChild(frame);
                        card.appendChild(title);
                        container.appendChild(card);
                    });
                }

                document.getElementById('input-page').value = currentPage;
                document.getElementById('page-info').textContent = `/ ${totalPages}`;
                document.getElementById('btn-prev').disabled = (currentPage <= 1);
                document.getElementById('btn-next').disabled = (currentPage >= totalPages);

            } catch (error) {
                console.error('Erreur lors du chargement du catalogue :', error);
            }
        }

        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 1 && newPage <= totalPages) {
                loadCatalog(newPage);
            }
        }

        function goToPage() {
            const pageInput = parseInt(document.getElementById('input-page').value);
            if (pageInput >= 1 && pageInput <= totalPages) {
                loadCatalog(pageInput);
            } else {
                alert(`Veuillez entrer une page valide entre 1 et ${totalPages}`);
            }
        }

        function triggerSearch() {
            loadCatalog(1);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    triggerSearch();
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (token) {
                localStorage.setItem('token', token);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            loadCatalog(1);
        });
    </script>
</body>
</html>
